[project]
name = "vox2lrc"
version = "0.1.0"
description = "Transcribe an isolated vocal stem into timed lyrics (.lrc and word-level JSON)."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
  "cactus-needle>=3.1",
]

[project.optional-dependencies]
faster-whisper = ["faster-whisper>=1.0", "numpy"]
server = ["fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.9"]

[project.scripts]
vox2lrc = "vox2lrc.cli:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
